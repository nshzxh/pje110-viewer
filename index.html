<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJE110 位置查看端</title>
<!-- PWA：手机浏览器"添加到主屏幕"后全屏打开 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#0D1117; --surface:#161B22; --alt:#1F2630; --line:#30363D;
  --txt:#E6EDF3; --sub:#8B949E; --accent:#58A6FF; --danger:#F85149; --ok:#3FB950;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--txt);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#map{position:fixed;inset:0;z-index:0}
#panel{position:fixed;top:12px;left:12px;z-index:1000;width:290px;max-width:calc(100vw - 24px);
  background:rgba(22,27,34,.94);border:1px solid var(--line);border-radius:10px;padding:12px}
#panel h1{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer}
#panel h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--sub);flex:none}
#panel h1 .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#panel h1 .dot.off{background:var(--danger);box-shadow:0 0 8px var(--danger)}
#panel h1 .fold{margin-left:auto;color:var(--sub);font-size:12px;user-select:none;
  border:1px solid var(--line);border-radius:5px;padding:1px 8px;background:var(--alt)}
#panelBody{margin-top:2px}
#panel.folded #panelBody{display:none}
#panel.folded{width:auto;padding:8px 12px}
#status{font-size:12px;color:var(--sub);margin:2px 0 8px}
.kv{display:grid;grid-template-columns:64px 1fr;gap:4px 8px;font-size:12px;margin-top:6px}
.kv b{color:var(--sub);font-weight:400}
.kv span{font-family:ui-monospace,Consolas,monospace;color:var(--txt);word-break:break-all}
#cfg{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:12px;color:var(--sub)}
#cfg label{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
#cfg input,#cfg select{background:var(--alt);border:1px solid var(--line);color:var(--txt);
  border-radius:5px;padding:3px 6px;width:150px;font-size:12px}
#cfg button{background:var(--accent);color:#04101f;border:0;border-radius:5px;
  padding:4px 12px;margin-top:8px;font-size:12px;cursor:pointer}
#lock{position:fixed;inset:0;z-index:2000;background:rgba(6,9,13,.97);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:16px}
#lock .logo{font-size:40px}
#lock h2{font-size:18px}
#lock input{background:var(--alt);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:10px 14px;width:240px;font-size:15px;text-align:center}
#lock button{background:var(--accent);color:#04101f;border:0;border-radius:8px;
  padding:10px 34px;font-size:14px;cursor:pointer}
#lock .err{color:var(--danger);font-size:13px;min-height:18px}
#lock.shake input{border-color:var(--danger);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hide{display:none!important}
.amap-logo,.amap-copyright{opacity:.45}

/* ---------------- 地图定位点：头像 + 名称标签 ---------------- */
.pin{display:flex;flex-direction:column;align-items:center;transform:translateY(7px)}
.pin .tag{display:flex;align-items:center;gap:4px;background:rgba(13,17,23,.92);
  border:1px solid var(--accent);border-radius:14px;padding:2px 8px 2px 3px;
  margin-bottom:5px;white-space:nowrap;user-select:none;-webkit-user-select:none;
  cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.pin .tag.sel{border-color:var(--ok);box-shadow:0 0 10px rgba(63,185,80,.6)}
.pin .av{width:22px;height:22px;border-radius:50%;background:var(--alt);
  display:flex;align-items:center;justify-content:center;font-size:15px;overflow:hidden;flex:none}
.pin .av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pin .nm{font-size:12px;color:var(--txt);max-width:88px;overflow:hidden;
  text-overflow:ellipsis}
.pin .pt{width:14px;height:14px;border-radius:50%;background:var(--accent);
  border:2px solid #fff;box-shadow:0 0 8px var(--accent)}

/* ---------------- 长按编辑弹窗 ---------------- */
#edit{position:fixed;inset:0;z-index:3000;background:rgba(6,9,13,.8);
  display:flex;align-items:center;justify-content:center}
#edit .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:16px;width:300px;max-width:calc(100vw - 32px)}
#edit h3{font-size:15px;margin-bottom:10px}
#edit .lbl{font-size:12px;color:var(--sub);margin:10px 0 4px}
#edit input{background:var(--alt);border:1px solid var(--line);color:var(--txt);
  border-radius:6px;padding:8px 10px;width:100%;font-size:13px}
#edit .emj{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
#edit .emj span{font-size:20px;text-align:center;padding:4px 0;border-radius:6px;
  border:1px solid transparent;cursor:pointer}
#edit .emj span.on{border-color:var(--accent);background:var(--alt)}
#edit .row{display:flex;gap:10px;margin-top:14px}
#edit .row button{flex:1;border:0;border-radius:8px;padding:9px 0;font-size:13px;cursor:pointer}
#edit .ok{background:var(--accent);color:#04101f}
#edit .cancel{background:var(--alt);color:var(--txt);border:1px solid var(--line)}

/* ---------------- 历史轨迹面板 ---------------- */
#hist{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:12px;color:var(--sub)}
#hist .h{display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  color:var(--txt);font-weight:500}
#hist .h .chev{color:var(--sub);font-size:11px;border:1px solid var(--line);
  border-radius:5px;padding:1px 8px;background:var(--alt)}
#hist .bd{margin-top:8px;display:none}
#hist.open .bd{display:block}
#hist .row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
#hist button{background:var(--alt);color:var(--txt);border:1px solid var(--line);
  border-radius:5px;padding:3px 9px;font-size:11px;cursor:pointer}
#hist button.on{background:var(--accent);color:#04101f;border-color:var(--accent)}
#hist button.go{background:var(--ok);color:#04101f;border-color:var(--ok)}
#hist button.dn{background:var(--danger);color:#fff;border-color:var(--danger)}
#hist input[type=date]{background:var(--alt);border:1px solid var(--line);color:var(--txt);
  border-radius:5px;padding:3px 6px;font-size:11px;width:calc(50% - 6px)}
#hist .meta{margin-top:6px;color:var(--sub);font-size:11px}
#hist .meta b{color:var(--txt);font-weight:500}
#hist .bar{margin-top:6px;display:flex;align-items:center;gap:8px}
#hist .bar input[type=range]{flex:1;accent-color:var(--accent)}
#hist .bar .t{font-size:11px;color:var(--sub);font-family:ui-monospace,Consolas,monospace;
  white-space:nowrap;min-width:120px;text-align:right}
#hist #histSeg{min-height:14px}
#hist #histSum{margin-top:4px}
#histStays{max-height:150px;overflow-y:auto;margin-top:4px;border:1px solid var(--line);
  border-radius:6px;background:rgba(31,38,48,.5)}
#histStays:empty{display:none}
#histStays .srow{padding:5px 8px;border-bottom:1px solid var(--line);font-size:11px;
  line-height:1.5;color:var(--txt)}
#histStays .srow:last-child{border-bottom:0}
#histStays .srow .nm{color:var(--accent)}
#histStays .srow .dur{color:var(--ok);font-family:ui-monospace,Consolas,monospace}
#histStays .srow .live{color:var(--ok);font-size:10px;border:1px solid var(--ok);
  border-radius:4px;padding:0 4px;margin-left:4px}

/* 停留叠加层：圆圈 + 时间标签 */
.stayTag{background:rgba(13,17,23,.92);border:1px solid #F0883E;border-radius:10px;
  padding:1px 7px;font-size:11px;color:var(--txt);white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.5);transform:translateY(-4px)}
.gapSeg{stroke-color:#8B949E}
</style>
</head>
<body>

<!-- 密码锁 -->
<div id="lock">
  <div class="logo">🛡️</div>
  <h2>PJE110 位置查看端</h2>
  <input id="pw" type="password" placeholder="请输入访问密码" autocomplete="off">
  <button id="unlock">解锁</button>
  <div class="err" id="pwErr"></div>
</div>

<!-- 地图 + 信息面板 -->
<div id="map"></div>
<div id="panel">
  <h1 id="panelHead"><span class="dot" id="dot"></span><span id="selName">实时位置</span>
    <span class="fold" id="btnFold">收起</span></h1>
  <div id="panelBody">
  <div id="status">未连接</div>
  <div class="kv">
    <b>经度</b><span id="vLon">—</span>
    <b>纬度</b><span id="vLat">—</span>
    <b>海拔</b><span id="vAlt">—</span>
    <b>精度</b><span id="vAcc">—</span>
    <b>速度</b><span id="vSpeed">—</span>
    <b>时间</b><span id="vTs">—</span>
    <b>状态</b><span id="vStatus">—</span>
    <b>更新</b><span id="vUpdated">—</span>
  </div>
  <div id="cfg">
    <label>轮询间隔 <input id="pollMs" type="number" min="3000" value="10000"> 毫秒</label>
    <label>地图样式 <select id="mapStyle">
      <option value="light">浅色（高德）</option>
      <option value="dark" selected>深色（高德）</option>
    </select></label>
    <button id="btnApply">应用设置</button>
  </div>

  <!-- 历史轨迹（IndexedDB 落库 + 日期选择 + 播放） -->
  <div id="hist">
    <div class="h" id="histHead"><span>历史轨迹</span><span class="chev" id="histChev">展开</span></div>
    <div class="bd">
      <div class="row" id="histRanges">
        <button data-range="today" class="on">今日</button>
        <button data-range="yesterday">昨日</button>
        <button data-range="3d">近 3 天</button>
        <button data-range="7d">近 7 天</button>
        <button data-range="custom">自定义</button>
      </div>
      <div class="row" id="histDates">
        <input type="date" id="histFrom">
        <input type="date" id="histTo">
      </div>
      <div class="row">
        <button id="histQuery" class="go">查询</button>
        <button id="histClear" class="dn">清空全部历史</button>
      </div>
      <div class="meta" id="histMeta">未查询</div>
      <div class="meta" id="histSum"></div>
      <div id="histStays"></div>
      <div class="bar">
        <button id="histPlay">▶</button>
        <input type="range" id="histSeek" min="0" max="0" value="0">
        <span class="t" id="histTime">—</span>
      </div>
      <div class="meta" id="histSeg"></div>
      <div class="row">
        <button id="histGpx">导出 GPX</button>
        <button id="histCsv">导出 CSV</button>
        <button id="histLive" style="margin-left:auto">返回实时模式</button>
      </div>
    </div>
  </div>
  </div>
</div>

<!-- 长按编辑：名称 + 头像 -->
<div id="edit" class="hide">
  <div class="box">
    <h3>编辑设备标签</h3>
    <div class="lbl">名称</div>
    <input id="edName" maxlength="12" placeholder="如：大宝">
    <div class="lbl">头像（点选 emoji，或填图片链接）</div>
    <div class="emj" id="edEmojis"></div>
    <div class="lbl">图片链接（选填，优先于 emoji）</div>
    <input id="edUrl" placeholder="https://…/avatar.png">
    <div class="row">
      <button class="cancel" id="edCancel">取消</button>
      <button class="ok" id="edSave">保存</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
 * PJE110 位置查看端（纯静态单文件，零服务器 · 高德地图版 · 多设备）
 * 使用前请修改下方 CONFIG：
 *   1) AMAP_KEY / AMAP_SECURITY_CODE —— 高德开放平台 Web 端 JS API 2.0
 *      （Key 免费申请；安全密钥见 docs/02 教程）
 *   2) GIST_RAW_URL —— 公开 Gist 的 position Raw 直链；
 *      多设备用 | 连接（每台设备一条 position_<标识>.json）
 *   3) GIST_API_URL —— 兜底：GitHub API（gistId 部分）
 *   4) PASSWORD_HASH —— sha256(密码)，留空则关闭密码锁
 *      默认密码 215331，其哈希已预置
 * ============================================================ */
var CONFIG = {
  AMAP_KEY: "",                    // 高德 Web 端 JS API Key
  AMAP_SECURITY_CODE: "",          // 高德安全密钥（jscode）
  GIST_RAW_URL: "https://gist.githubusercontent.com/nshzxh/1de7f80daeee6b5c5885409654f2369d/raw/position_1.json",
  GIST_API_URL: "https://api.github.com/gists/1de7f80daeee6b5c5885409654f2369d",
  POLL_MS: 10000,                  // 默认轮询间隔
  OFFLINE_AFTER_S: 600,            // 超时判离线（孩子端静止 5 分钟心跳，容忍 2 个周期）
  PASSWORD_HASH: "1e4e3e5261e01887e5b743cdd1fa4e660853cb1c3378083f6cbffa2cf854f7a8"
};

/* ---------------- URL 参数覆盖（供 parent_viewer_app 注入配置） ----------------
 * 用法：?amap_key=xxx&amap_sec=xxx&gist_raw=xxx&gist_api=xxx&pw_hash=xxx&poll=5000
 * gist_raw 支持多条直链，用 | 连接（多设备）。
 * 任意参数缺省则沿用上方默认值。 */
(function () {
  var q = new URLSearchParams(location.search);
  if (q.has("amap_key")) CONFIG.AMAP_KEY = q.get("amap_key");
  if (q.has("amap_sec")) CONFIG.AMAP_SECURITY_CODE = q.get("amap_sec");
  if (q.has("gist_raw")) CONFIG.GIST_RAW_URL = q.get("gist_raw");
  if (q.has("gist_api")) CONFIG.GIST_API_URL = q.get("gist_api");
  if (q.has("pw_hash")) CONFIG.PASSWORD_HASH = q.get("pw_hash");
  if (q.has("poll")) CONFIG.POLL_MS = parseInt(q.get("poll"), 10) || CONFIG.POLL_MS;
  // 让面板轮询输入框同步 URL 注入的间隔（否则 input 的 HTML 默认值优先）
  var el = document.getElementById("pollMs");
  if (el && q.has("poll")) el.value = CONFIG.POLL_MS;
})();

/* ---------------- 密码锁 ---------------- */
var unlocked = sessionStorage.getItem("opsec_unlocked") === "1";
if (!CONFIG.PASSWORD_HASH) unlocked = true;
var lockEl = document.getElementById("lock");
if (unlocked) lockEl.classList.add("hide");
else lockEl.classList.remove("hide");

async function sha256hex(s) {
  var d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(d)).map(function(b){return b.toString(16).padStart(2,"0")}).join("");
}

document.getElementById("unlock").addEventListener("click", async function () {
  var pw = document.getElementById("pw").value;
  var h = await sha256hex(pw);
  if (h === CONFIG.PASSWORD_HASH) {
    sessionStorage.setItem("opsec_unlocked", "1");
    lockEl.classList.add("hide");
    startPolling();
  } else {
    var err = document.getElementById("pwErr");
    lockEl.classList.remove("shake"); void lockEl.offsetWidth; lockEl.classList.add("shake");
    err.textContent = "密码错误";
  }
});
document.getElementById("pw").addEventListener("keydown", function(e){
  if (e.key === "Enter") document.getElementById("unlock").click();
});

/* ---------------- 面板折叠（隐藏/弹出实时位置信息） ---------------- */
var panelEl = document.getElementById("panel");
var btnFold = document.getElementById("btnFold");
btnFold.addEventListener("click", function (e) {
  e.stopPropagation();
  panelEl.classList.toggle("folded");
  btnFold.textContent = panelEl.classList.contains("folded") ? "展开" : "收起";
});
document.getElementById("panelHead").addEventListener("click", function () {
  if (panelEl.classList.contains("folded")) btnFold.click();
});

/* ---------------- 多设备状态 ----------------
 * devices[key] = {key, rawUrl, fileName, name, avatar, lastTs, points:[],
 *                 marker, trail, online, last:{payload}}
 * key 优先取上报数据里的 device_id；无则用直链文件名。 */
var devices = {};
var selKey = null;          // 当前选中的设备（面板显示其详情）
var map = null, firstFix = false;
var EMOKIT = ["🧒","👦","👧","👨‍🎓","👩‍🎓","🧑","👶","🦸","🐱","🐶","🦊","⭐"];

function loadPins() {
  try { return JSON.parse(localStorage.getItem("opsec_pins") || "{}"); }
  catch (e) { return {}; }
}
function savePins(p) {
  try { localStorage.setItem("opsec_pins", JSON.stringify(p)); } catch (e) {}
}
function avatarHtml(a) {
  if (a && a.indexOf("http") === 0)
    return '<span class="av"><img src="' + a.replace(/"/g, "%22") + '"></span>';
  return '<span class="av">' + (a || "🧒") + '</span>';
}

function setStatusText(t) { document.getElementById("status").textContent = t; }

/* ---------------- 高德地图（动态加载，未配 Key 则提示） ---------------- */
if (CONFIG.AMAP_KEY) {
  // 高德 v2.0 安全密钥必须在加载 API 前注入
  window._AMapSecurityConfig = { securityJsCode: CONFIG.AMAP_SECURITY_CODE };
  var api = document.createElement("script");
  api.src = "https://webapi.amap.com/maps?v=2.0&key=" + encodeURIComponent(CONFIG.AMAP_KEY);
  api.onload = initMap;
  api.onerror = function () {
    setStatusText("高德地图加载失败：检查 Key / 网络（如未申请 Key 请阅读 docs/02 教程）");
  };
  document.head.appendChild(api);
} else {
  setStatusText("未配置高德 Key，请阅读 docs/02 教程申请后填入 CONFIG.AMAP_KEY");
}

function initMap() {
  map = new AMap.Map("map", {
    zoom: 8,
    center: [114.3, 30.5],
    mapStyle: "amap://styles/dark",
    viewMode: "2D"
  });
  // 为已存在的设备补建 marker/trail
  for (var k in devices) ensureMarker(devices[k]);
  if (unlocked) startPolling();
}

function ensureMarker(d) {
  if (!map || d.marker) return;
  d.marker = new AMap.Marker({
    position: [114.3, 30.5],
    anchor: "bottom-center",
    content: pinHtml(d)
  });
  d.marker.on("click", function () { selectDevice(d.key); });
  map.add(d.marker);
  d.trail = new AMap.Polyline({
    path: [], strokeColor: "#58A6FF", strokeWeight: 3,
    strokeOpacity: 0.8, lineJoin: "round"
  });
  map.add(d.trail);
}

/* 定位点 HTML：上方头像+名称标签（长按编辑），下方圆点；选中设备标签变绿框 */
function pinHtml(d) {
  return '<div class="pin"><div class="tag' + (d.key === selKey ? " sel" : "") +
    '" data-dev="' + d.key + '">' +
    avatarHtml(d.avatar) + '<span class="nm">' + esc(d.name) + '</span></div>' +
    '<div class="pt"></div></div>';
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c];
  });
}

/* 刷新某个设备的 marker 样式（换名/换头像/选中态） */
function refreshMarker(d) {
  if (d.marker) d.marker.setContent(pinHtml(d));
}

/* ---------------- 数据轮询（逐设备直链 → 失败走 API 兜底） ---------------- */
var timer = null;
var histSyncTimer = null;

function startPolling() {
  if (timer) clearInterval(timer);
  if (histSyncTimer) clearInterval(histSyncTimer);
  fetchAll();
  timer = setInterval(fetchAll, Math.max(3000, +document.getElementById("pollMs").value || CONFIG.POLL_MS));
  // 云端历史同步：启动拉一次 + 每 10 分钟刷新（原始 raw 有 ~5min CDN 缓存，更高频无意义）
  syncCloudHistory();
  histSyncTimer = setInterval(syncCloudHistory, 10 * 60 * 1000);
}

/* ---------------- 云端历史同步（hist_<标识>.json） ----------------
 * 孩子端每次上报随 position 同请求滚动写入 hist_<deviceId>.json
 * （最近 200 点，家长端不在线期间的位置不再丢失）。
 * 此处拉取后合并进 IndexedDB，本地实时捕获的点与云端点按 (dev,ts) 去重。 */
function histUrlOf(url) {
  return url.replace(/position_/, "hist_").replace(/position\.json/, "hist.json");
}

function syncCloudHistory() {
  rawUrls().forEach(function (u, i) {
    fetch(histUrlOf(u), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("hist " + r.status); return r.json(); })
      .then(function (arr) {
        if (!Array.isArray(arr) || !arr.length) return;
        openDB().then(function () {
          arr.forEach(function (p) {
            var ts = +p.timestamp;
            if (!isFinite(ts) || !isFinite(+p.lat) || !isFinite(+p.lon)) return;
            upsertPoint(devKeyOf(p, u, i), ts, +p.lat, +p.lon,
              p.alt, p.accuracy, p.speed, p.status, p.t, p.stay);
          });
        });
      })
      .catch(function () { /* 老版本孩子端无 hist 文件：静默跳过 */ });
  });
}

function rawUrls() {
  return (CONFIG.GIST_RAW_URL || "").split("|").map(function (s) { return s.trim(); })
    .filter(function (s) { return s.length > 0; });
}

function fileNameOf(url) {
  var seg = url.split("?")[0].split("/");
  return seg[seg.length - 1] || "position.json";
}

function fetchAll() {
  var urls = rawUrls();
  if (!urls.length) { setOfflinePanel("未配置 Gist 直链"); return; }
  urls.forEach(function (u, i) { fetchOne(u, i); });
}

function fetchOne(url, idx) {
  fetch(url, { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("raw " + r.status);
      return r.json();
    })
    .catch(function () {   // 兜底走 GitHub API（公开 gist 免鉴权）
      return fetch(CONFIG.GIST_API_URL, { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("api " + r.status); return r.json(); })
        .then(function (j) {
          var f = j.files && j.files[fileNameOf(url)];
          if (!f || !f.content) throw new Error("no " + fileNameOf(url));
          return JSON.parse(f.content);
        });
    })
    .then(function (p) { render(p, url, idx); })
    .catch(function (e) { markOffline(url, idx, e.message); });
}

function devKeyOf(p, url, idx) {
  var id = p && (p.device_id || p.deviceId);
  if (id) return String(id);
  // 兼容旧数据：按文件名 / 直链序号区分
  var m = fileNameOf(url).match(/position_?(.*)\.json/);
  return (m && m[1]) ? m[1] : ("dev" + (idx + 1));
}

function render(p, url, idx) {
  var lat = +p.lat, lon = +p.lon, ts = +p.timestamp;
  if (!isFinite(lat) || !isFinite(lon)) throw new Error("bad data");

  var key = devKeyOf(p, url, idx);
  var pins = loadPins();
  var d = devices[key];
  if (!d) {
    d = devices[key] = {
      key: key, rawUrl: url, lastTs: 0, points: [], online: true, last: null,
      name: (pins[key] && pins[key].name) || p.device_name ||
            (key === "dev" + (idx + 1) ? "设备" + (idx + 1) : "设备 " + key),
      avatar: (pins[key] && pins[key].avatar) || ""
    };
    ensureMarker(d);
  }
  d.last = p;
  d.lastTs = ts;
  d.online = true;
  if (pins[key] && pins[key].name) d.name = pins[key].name;   // 本地改名优先
  if (pins[key] && pins[key].avatar) d.avatar = pins[key].avatar;

  // 落库到 IndexedDB（按 dev+ts 去重；histMode 也持续入库，下次查询即包含）
  upsertPoint(key, ts, lat, lon, p.alt, p.accuracy, p.speed, p.status, p.t, p.stay);

  // 历史模式：跳过实时地图更新，避免覆盖历史轨迹视图
  if (histMode) {
    if (key === selKey) fillPanel(d);
    updateStatusLine();
    return;
  }

  // 地图：点位 + 轨迹
  if (map && d.marker) {
    d.marker.setPosition([lon, lat]);
    refreshMarker(d);
    d.points.push([lon, lat]);
    if (d.points.length > 500) d.points.shift();
    if (d.trail) d.trail.setPath(d.points);
    // 第一个设备的第一个点 → 定位视野；选中设备更新时跟随平移
    if (!firstFix) { firstFix = true; map.setZoomAndCenter(15, [lon, lat]); }
    else if (key === selKey) map.panTo([lon, lat]);
  }

  // 默认选中第一个上报的设备
  if (!selKey || !devices[selKey]) selectDevice(key);
  else if (key === selKey) fillPanel(d);
  updateStatusLine();
}

function selectDevice(key) {
  if (!devices[key]) return;
  selKey = key;
  for (var k in devices) refreshMarker(devices[k]);   // 重建标签刷新选中态
  fillPanel(devices[key]);
}

function fillPanel(d) {
  var p = d.last || {};
  document.getElementById("selName").textContent = d.name;
  document.getElementById("dot").className = "dot " + (d.online ? "on" : "off");
  document.getElementById("vLon").textContent = (+p.lon || 0).toFixed(6);
  document.getElementById("vLat").textContent = (+p.lat || 0).toFixed(6);
  document.getElementById("vAlt").textContent = (+p.alt || 0).toFixed(1) + " m";
  document.getElementById("vAcc").textContent = (+p.accuracy || 0).toFixed(1) + " m";
  document.getElementById("vSpeed").textContent = (+p.speed || 0).toFixed(1) + " m/s";
  document.getElementById("vTs").textContent = fmtTime(d.lastTs);
  document.getElementById("vStatus").textContent =
    d.online ? (p.status || "online") : "离线";
  document.getElementById("vUpdated").textContent = fmtTime(Date.now());
}

function updateStatusLine() {
  var all = Object.keys(devices).map(function (k) { return devices[k]; });
  var onCnt = all.filter(function (d) { return d.online; }).length;
  var parts = all.map(function (d) {
    return d.name + (d.online ? "✓" : "✗");
  });
  setStatusText("在线 " + onCnt + "/" + all.length + " · " + parts.join(" / ") +
    " · 点地图标签可切换/长按改头像");
}

function markOffline(url, idx, msg) {
  // 找到该直链对应设备并标记离线（未建立设备的忽略）
  for (var k in devices) {
    if (devices[k].rawUrl === url) { devices[k].online = false; break; }
  }
  if (selKey && devices[selKey] && devices[selKey].rawUrl === url) fillPanel(devices[selKey]);
  if (!Object.keys(devices).length) setOfflinePanel("获取失败: " + msg);
  else updateStatusLine();
}

function setOfflinePanel(msg) {
  document.getElementById("dot").className = "dot off";
  setStatusText("离线 · " + msg);
}

/* 离线判定：逐设备超过阈值无新数据 */
setInterval(function () {
  var changed = false;
  for (var k in devices) {
    var d = devices[k];
    if (d.online && d.lastTs &&
        Date.now() - d.lastTs > CONFIG.OFFLINE_AFTER_S * 1000) {
      d.online = false; changed = true;
    }
  }
  if (changed) {
    if (selKey && devices[selKey]) fillPanel(devices[selKey]);
    updateStatusLine();
  }
}, 5000);

function fmtTime(t) {
  if (!t) return "—";
  var d = new Date(t);
  var p = function (n){ return n < 10 ? "0" + n : "" + n; };
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) +
    " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

/* ============================================================
 * IndexedDB 历史轨迹落库（方案 B）
 * ------------------------------------------------------------
 * 每次拉到的位置点入库，复合主键 (dev, ts) 去重，避免重复存储。
 * 容量几乎无限（500MB+），保留 90 天历史用于轨迹回放。
 *
 * 天然限制：孩子端覆盖式上报，家长端 APP 长时间不打开期间的位置
 * 会被后续覆盖丢失，本地无对应历史。本端只能落库每次成功拉到的点。
 * ============================================================ */
var DB_NAME = "opsec_tracks";
var DB_VER = 1;
var db = null;

function openDB() {
  if (db) return Promise.resolve(db);
  if (!("indexedDB" in window)) { console.warn("IDB not supported"); return Promise.resolve(null); }
  return new Promise(function (resolve) {
    var req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = function (e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains("points")) {
        var os = d.createObjectStore("points", { keyPath: ["dev", "ts"] });
        os.createIndex("dev", "dev", { unique: false });
        os.createIndex("ts", "ts", { unique: false });
        os.createIndex("dev_ts", ["dev", "ts"], { unique: true });
      }
    };
    req.onsuccess = function (e) { db = e.target.result; resolve(db); };
    req.onerror = function (e) { console.warn("IDB open failed", e.target.error); resolve(null); };
  });
}

/** UPSERT 一个点位（重复 ts 自动覆盖，达到去重）
 *  t: m=移动 a=到达 l=离开 s=停留心跳（孩子端停留压缩标记，缺省视为 m）*/
function upsertPoint(dev, ts, lat, lon, alt, acc, speed, status, t, stay) {
  if (!db || !dev || !ts) return;
  try {
    var tx = db.transaction("points", "readwrite");
    tx.objectStore("points").put({
      dev: dev, ts: +ts, lat: +lat, lon: +lon,
      alt: +alt || 0, acc: +acc || 0, speed: +speed || 0, status: status || "",
      t: t || "m", stay: +stay || 0
    });
    tx.onerror = function () {};
  } catch (e) {}
}

/** 按设备 + 时间范围查询所有点（按时间升序） */
function queryPoints(dev, fromTs, toTs) {
  if (!db) return Promise.resolve([]);
  return new Promise(function (resolve) {
    try {
      var tx = db.transaction("points", "readonly");
      var idx = tx.objectStore("points").index("dev_ts");
      var range = IDBKeyRange.bound([dev, +fromTs], [dev, +toTs]);
      var req = idx.getAll(range);
      req.onsuccess = function () { resolve(req.result || []); };
      req.onerror = function () { resolve([]); };
    } catch (e) { resolve([]); }
  });
}

/** 删除 ts < beforeTs 的所有点，返回删除数 */
function pruneOld(beforeTs) {
  if (!db) return Promise.resolve(0);
  return new Promise(function (resolve) {
    try {
      var tx = db.transaction("points", "readwrite");
      var idx = tx.objectStore("points").index("ts");
      var req = idx.openCursor(IDBKeyRange.upperBound(+beforeTs));
      var n = 0;
      req.onsuccess = function (e) {
        var c = e.target.result;
        if (c) { c.delete(); n++; c.continue(); }
        else resolve(n);
      };
      req.onerror = function () { resolve(n); };
    } catch (e) { resolve(0); }
  });
}

/* ============================================================
 * 历史轨迹查询 / 播放 / 自动清理
 * ============================================================ */
var histMode = false;            // true = 历史视图，跳过实时地图更新但持续入库
var histTrail = null;            // 历史轨迹 Polyline（橙色，区别于实时蓝色）
var histGapTrail = null;         // 数据缺失段 Polyline（灰色虚线）
var histMarker = null;           // 历史播放头 marker
var histPoints = [];             // 当前查询结果（已剔除停留心跳 s）
var histStaysArr = [];           // 停留配对 [{aTs,lTs,lat,lon,stays}]
var histOverlays = [];           // 停留叠加层（圆圈+标签）
var histPlayIdx = 0;
var histPlayTimer = null;
var GAP_MS = 15 * 60 * 1000;     // 记录间隔超此值视为数据缺失（关机/离线）

function histInit() {
  // 折叠头部
  document.getElementById("histHead").addEventListener("click", function () {
    var el = document.getElementById("hist");
    el.classList.toggle("open");
    document.getElementById("histChev").textContent =
      el.classList.contains("open") ? "收起" : "展开";
  });
  // 范围按钮 → 自动填日期
  document.getElementById("histRanges").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    Array.prototype.forEach.call(b.parentNode.children, function (c) { c.className = ""; });
    b.className = "on";
    setHistRange(b.getAttribute("data-range"));
  });
  document.getElementById("histQuery").addEventListener("click", queryHistory);
  document.getElementById("histClear").addEventListener("click", clearHistory);
  document.getElementById("histLive").addEventListener("click", exitHistMode);
  document.getElementById("histGpx").addEventListener("click", function () { exportHist("gpx"); });
  document.getElementById("histCsv").addEventListener("click", function () { exportHist("csv"); });
  document.getElementById("histPlay").addEventListener("click", togglePlay);
  document.getElementById("histSeek").addEventListener("input", function () {
    seekHist(+this.value);
  });
  // 默认填"今日"
  setHistRange("today");
}

function setHistRange(r) {
  var from = document.getElementById("histFrom");
  var to = document.getElementById("histTo");
  var p = function (n) { return n < 10 ? "0" + n : "" + n; };
  var fmtD = function (d) { return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); };
  var today = new Date(); today.setHours(0, 0, 0, 0);
  if (r === "today") {
    from.value = fmtD(today); to.value = fmtD(today);
  } else if (r === "yesterday") {
    var y = new Date(today.getTime() - 86400000);
    from.value = fmtD(y); to.value = fmtD(y);
  } else if (r === "3d") {
    var d3 = new Date(today.getTime() - 2 * 86400000);
    from.value = fmtD(d3); to.value = fmtD(today);
  } else if (r === "7d") {
    var d7 = new Date(today.getTime() - 6 * 86400000);
    from.value = fmtD(d7); to.value = fmtD(today);
  }
  // custom 不动 from/to，让用户自填
}

async function queryHistory() {
  if (!map) { setHistMeta("地图加载中，请稍候再试"); return; }
  if (!selKey || !devices[selKey]) { setHistMeta("请先在地图上点选一个设备"); return; }
  var fromD = document.getElementById("histFrom").value;
  var toD = document.getElementById("histTo").value;
  if (!fromD || !toD) { setHistMeta("请选择起止日期"); return; }
  var fromTs = new Date(fromD + "T00:00:00").getTime();
  var toTs = new Date(toD + "T23:59:59.999").getTime();
  if (isNaN(fromTs) || isNaN(toTs)) { setHistMeta("日期格式无效"); return; }
  if (fromTs > toTs) { setHistMeta("起始日期不能晚于结束日期"); return; }

  enterHistMode();
  setHistMeta("查询中…");
  await openDB();
  var all = await queryPoints(selKey, fromTs, toTs);
  // 剔除停留心跳（t=s）：仅保留移动/到达/离开三类有效记录
  histPoints = all.filter(function (p) { return (p.t || "m") !== "s"; });
  drawHistTrail();
  setHistMeta("设备 <b>" + esc(devices[selKey].name) + "</b> · 有效记录 <b>" +
    histPoints.length + "</b> 条" +
    (all.length > histPoints.length ? "（剔除停留心跳 " + (all.length - histPoints.length) + " 点）" : ""));
  buildStays();
  buildSummary();
  // 重置播放
  stopPlay();
  histPlayIdx = 0;
  var seek = document.getElementById("histSeek");
  seek.max = Math.max(0, histPoints.length - 1);
  seek.value = 0;
  showHistPoint(0);
}

function enterHistMode() {
  if (histMode) return;
  histMode = true;
  // 隐藏实时 marker 和 trail，避免覆盖历史视图
  for (var k in devices) {
    if (devices[k].marker) devices[k].marker.setMap(null);
    if (devices[k].trail) devices[k].trail.setMap(null);
  }
  // 创建历史轨迹（橙色）、缺失段虚线和播放头
  if (map && !histTrail) {
    histTrail = new AMap.Polyline({
      path: [], strokeColor: "#F0883E", strokeWeight: 4,
      strokeOpacity: 0.85, lineJoin: "round"
    });
    histTrail.setMap(map);
    histGapTrail = new AMap.Polyline({
      path: [], strokeColor: "#8B949E", strokeWeight: 3,
      strokeOpacity: 0.7, strokeStyle: "dashed"
    });
    histGapTrail.setMap(map);
    histMarker = new AMap.Marker({
      position: [114.3, 30.5],
      anchor: "bottom-center",
      content: '<div class="pin"><div class="pt" style="background:#F0883E;box-shadow:0 0 8px #F0883E"></div></div>'
    });
    histMarker.setMap(map);
  }
}

function clearHistOverlays() {
  histOverlays.forEach(function (o) { o.setMap && o.setMap(null); });
  histOverlays = [];
}

function exitHistMode() {
  if (!histMode) return;
  histMode = false;
  stopPlay();
  if (histTrail) { histTrail.setMap(null); histTrail = null; }
  if (histGapTrail) { histGapTrail.setMap(null); histGapTrail = null; }
  if (histMarker) { histMarker.setMap(null); histMarker = null; }
  clearHistOverlays();
  histPoints = [];
  histStaysArr = [];
  document.getElementById("histStays").innerHTML = "";
  document.getElementById("histSum").textContent = "";
  document.getElementById("histSeg").textContent = "";
  // 恢复实时 marker 和 trail
  for (var k in devices) {
    if (devices[k].marker) devices[k].marker.setMap(map);
    if (devices[k].trail) devices[k].trail.setMap(map);
  }
  setHistMeta("已返回实时模式");
}

function drawHistTrail() {
  if (!histTrail) return;
  if (!histPoints.length) { histTrail.setPath([]); histGapTrail.setPath([]); return; }
  var path = histPoints.map(function (p) { return [+p.lon, +p.lat]; });
  histTrail.setPath(path);
  // 数据缺失段（间隔 ≥15min 且不是"到达→离开"的停留段）：灰色虚线
  var gaps = [];
  for (var i = 1; i < histPoints.length; i++) {
    var prev = histPoints[i - 1], cur = histPoints[i];
    var dt = +cur.ts - +prev.ts;
    if (dt >= GAP_MS && (prev.t || "m") !== "a") {
      gaps.push([+prev.lon, +prev.lat], [+cur.lon, +cur.lat]);
    }
  }
  histGapTrail.setPath(gaps);
  map.setFitView([histTrail, histGapTrail]);
}

function showHistPoint(i) {
  if (!histPoints.length || !histMarker) return;
  i = Math.max(0, Math.min(i, histPoints.length - 1));
  var p = histPoints[i];
  histMarker.setPosition([+p.lon, +p.lat]);
  document.getElementById("histTime").textContent =
    fmtTime(+p.ts) + " · " + (+p.lat).toFixed(5) + "," + (+p.lon).toFixed(5);
  // 段信息：类型 / 与上点间隔（缺失告警）/ 位移 / 均速
  var seg = typeLabel(p.t);
  var prev = i > 0 ? histPoints[i - 1] : null;
  if (prev) {
    var dt = +p.ts - +prev.ts;
    var dd = distBetween(+prev.lat, +prev.lon, +p.lat, +p.lon);
    var kind;
    if (dt >= GAP_MS && (prev.t || "m") === "a") kind = "停留 " + fmtDur(dt);
    else if (dt >= GAP_MS) kind = "⚠ 缺失 " + fmtDur(dt);
    else kind = "间隔 " + fmtDur(dt);
    var v = dt > 0 ? dd / (dt / 1000) : 0;
    seg += " · " + kind + " · 移动 " + dd.toFixed(0) + "m · " + v.toFixed(1) + "m/s";
  }
  document.getElementById("histSeg").textContent = seg;
  var seek = document.getElementById("histSeek");
  if (+seek.value !== i) seek.value = i;
}

function typeLabel(t) {
  return { m: "移动", a: "到达", l: "离开", s: "心跳" }[t || "m"] || "移动";
}

function fmtDur(ms) {
  var s = Math.round(ms / 1000);
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  if (h > 0) return h + "小时" + m + "分";
  if (m > 0) return m + "分" + (ss >= 1 ? ss + "秒" : "");
  return ss + "秒";
}

function distBetween(lat1, lon1, lat2, lon2) {
  var r = 6371000;
  var p1 = Math.PI * lat1 / 180, p2 = Math.PI * lat2 / 180;
  var dp = Math.PI * (lat2 - lat1) / 180, dl = Math.PI * (lon2 - lon1) / 180;
  var a = Math.sin(dp / 2) * Math.sin(dp / 2) +
    Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
  return 2 * r * Math.asin(Math.sqrt(a));
}

function seekHist(i) {
  histPlayIdx = i;
  showHistPoint(i);
}

function togglePlay() {
  if (histPlayTimer) stopPlay();
  else startPlay();
}

function startPlay() {
  if (!histPoints.length) return;
  if (histPlayIdx >= histPoints.length - 1) histPlayIdx = 0;
  document.getElementById("histPlay").textContent = "⏸";
  // 固定步进 400ms（点数多时约相当于 2.5x 加速；用户可拖时间轴跳过）
  histPlayTimer = setInterval(function () {
    histPlayIdx++;
    if (histPlayIdx >= histPoints.length) { stopPlay(); return; }
    showHistPoint(histPlayIdx);
  }, 400);
}

function stopPlay() {
  if (histPlayTimer) { clearInterval(histPlayTimer); histPlayTimer = null; }
  document.getElementById("histPlay").textContent = "▶";
}

async function clearHistory() {
  if (!confirm("确认清空所有设备的历史轨迹？此操作不可撤销。")) return;
  await openDB();
  var n = await pruneOld(Date.now());   // before=now → 全部清空
  setHistMeta("已清空 <b>" + n + "</b> 条历史记录");
  if (histMode) {
    histPoints = [];
    histStaysArr = [];
    if (histTrail) histTrail.setPath([]);
    if (histGapTrail) histGapTrail.setPath([]);
    clearHistOverlays();
    var seek = document.getElementById("histSeek");
    seek.max = 0; seek.value = 0;
    document.getElementById("histTime").textContent = "—";
    document.getElementById("histSeg").textContent = "";
    document.getElementById("histSum").textContent = "";
    document.getElementById("histStays").innerHTML = "";
  }
}

function setHistMeta(html) {
  document.getElementById("histMeta").innerHTML = html;
}

/* ---------------- 停留统计：到达/离开配对 → 列表 + 地图叠加层 ---------------- */
function buildStays() {
  clearHistOverlays();
  histStaysArr = [];
  var box = document.getElementById("histStays");
  box.innerHTML = "";
  var open = null;
  histPoints.forEach(function (p) {
    var t = p.t || "m";
    if (t === "a") {
      if (open) histStaysArr.push(open);        // 上一个停留缺"离开"，先收
      open = { aTs: +p.ts, lTs: 0, lat: +p.lat, lon: +p.lon, stays: 0 };
    } else if (t === "l") {
      if (open) {
        open.lTs = +p.ts;
        open.stays = +p.stay || Math.round((open.lTs - open.aTs) / 1000);
        histStaysArr.push(open);
        open = null;
      }
      // 无到达的离开：忽略（前一停留已被收口）
    }
  });
  if (open) histStaysArr.push(open);            // 停留中（无离开记录）

  // 渲染列表 + 地图叠加层
  histStaysArr.forEach(function (s, idx) {
    var dur = s.lTs ? (s.stays || Math.round((s.lTs - s.aTs) / 1000)) : 0;
    var timeTxt = fmtTime(s.aTs).slice(11) + " – " +
      (s.lTs ? fmtTime(s.lTs).slice(11) : "…");
    var row = document.createElement("div");
    row.className = "srow";
    row.innerHTML = "📍 <span class=\"nm\" id=\"stayNm" + idx + "\">" +
      (+s.lat).toFixed(4) + "," + (+s.lon).toFixed(4) + "</span><br>" +
      timeTxt + " · <span class=\"dur\">" +
      (s.lTs ? "停留 " + fmtDur(dur * 1000) : "计算中") + "</span>" +
      (s.lTs ? "" : '<span class="live">停留中</span>');
    box.appendChild(row);

    // 逆地理编码填充地名
    regeoName(s.lon, s.lat, function (name) {
      var el = document.getElementById("stayNm" + idx);
      if (el && name) el.textContent = name;
    });

    // 地图：停留圈 + 时间标签
    if (map) {
      var circle = new AMap.Circle({
        center: [s.lon, s.lat], radius: 50,
        strokeColor: "#F0883E", strokeOpacity: 0.5, strokeWeight: 1,
        fillColor: "#F0883E", fillOpacity: 0.08
      });
      circle.setMap(map);
      var label = new AMap.Marker({
        position: [s.lon, s.lat], anchor: "bottom-center",
        content: '<div class="stayTag">' + timeTxt +
          (s.lTs ? " · " + fmtDur(dur * 1000) : " · 停留中") + '</div>'
      });
      label.setMap(map);
      histOverlays.push(circle, label);
    }
  });
}

/* ---------------- 日汇总：总距离 / 停留次数 / 时间跨度 ---------------- */
function buildSummary() {
  var el = document.getElementById("histSum");
  if (!histPoints.length) { el.textContent = ""; return; }
  var total = 0;
  for (var i = 1; i < histPoints.length; i++) {
    var prev = histPoints[i - 1], cur = histPoints[i];
    var dt = +cur.ts - +prev.ts;
    if (dt <= GAP_MS && (prev.t || "m") !== "a") {
      total += distBetween(+prev.lat, +prev.lon, +cur.lat, +cur.lon);
    }
    // 停留段（到达→离开）与缺失段不计入移动距离
  }
  var span = fmtTime(+histPoints[0].ts).slice(11) + " – " +
    fmtTime(+histPoints[histPoints.length - 1].ts).slice(11);
  el.innerHTML = "移动 <b>" + (total / 1000).toFixed(2) + "</b> km · 停留 <b>" +
    histStaysArr.length + "</b> 次 · 跨度 " + span;
}

/* ---------------- 逆地理编码：停留坐标 → 地名（localStorage 缓存） ---------------- */
function regeoName(lng, lat, cb) {
  var key = (+lat).toFixed(4) + "," + (+lng).toFixed(4);
  var cache = {};
  try { cache = JSON.parse(localStorage.getItem("opsec_regeo") || "{}"); } catch (e) {}
  if (cache[key]) { cb(cache[key]); return; }
  if (!CONFIG.AMAP_KEY || !window.AMap) { cb(null); return; }
  AMap.plugin("AMap.Geocoder", function () {
    try {
      new AMap.Geocoder().getAddress([+lng, +lat], function (status, result) {
        var name = null;
        if (status === "complete" && result && result.regeocode)
          name = result.regeocode.formattedAddress || null;
        if (name) {
          cache[key] = name;
          try { localStorage.setItem("opsec_regeo", JSON.stringify(cache)); } catch (e) {}
        }
        cb(name);
      });
    } catch (e) { cb(null); }
  });
}

/* ---------------- 轨迹导出：GPX / CSV ---------------- */
function exportHist(kind) {
  if (!histPoints.length) { setHistMeta("无可导出数据，请先查询"); return; }
  var from = document.getElementById("histFrom").value;
  var to = document.getElementById("histTo").value;
  var fname = "opsec_" + selKey + "_" + from + "_" + to +
    (kind === "csv" ? ".csv" : ".gpx");
  var content, mime;
  if (kind === "csv") {
    var rows = ["time,lat,lon,alt_m,speed_mps,acc_m,type,stay_s"];
    histPoints.forEach(function (p) {
      rows.push([new Date(+p.ts).toISOString(), p.lat, p.lon, p.alt,
        p.speed, p.acc, (p.t || "m"), p.stay || 0].join(","));
    });
    content = "\uFEFF" + rows.join("\n");
    mime = "text/csv";
  } else {
    var pts = histPoints.map(function (p) {
      return '      <trkpt lat="' + p.lat + '" lon="' + p.lon + '"><time>' +
        new Date(+p.ts).toISOString() + '</time></trkpt>';
    }).join("\n");
    content = '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<gpx version="1.1" creator="pje110-viewer"><trk><name>opsec ' +
      esc(selKey) + '</name><trkseg>\n' + pts + '\n</trkseg></trk></gpx>';
    mime = "application/gpx+xml";
  }
  var blob = new Blob([content], { type: mime });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/** 启动后自动清理 90 天前的旧点（单次执行，无定时循环避免耗电） */
async function autoPrune() {
  await openDB();
  var before = Date.now() - 90 * 86400000;
  var n = await pruneOld(before);
  if (n > 0) console.log("[hist] auto-prune deleted", n, "points older than 90d");
}

// 历史模式 UI 事件绑定（不依赖 DB，可立即初始化）
histInit();
// 解锁后异步初始化 DB + 自动清理（不解锁也需要查询/清空，但未解锁时不会触发）
if (unlocked) { openDB().then(autoPrune); }

/* ---------------- PWA：注册 Service Worker（需 HTTPS/GitHub Pages） ---------------- */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(function () { /* file:// 或受限环境静默跳过 */ });
}
